services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: threat
      POSTGRES_PASSWORD: threat
      POSTGRES_DB: threatdb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat -d threatdb"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://threat:threat@db:5432/threatdb
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    image: node:20
    working_dir: /app
    volumes: ["./frontend:/app"]
    environment:
      VITE_API_TARGET: http://backend:8000
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
